<!DOCTYPE html>
<html>
<head>
    <title>Study Resources</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .category {
            font-size: 12px;
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            color: #43e97b;
            font-weight: 500;
        }
    </style>
</head>
<body>

<h2>Study Resources</h2>

<div class="grid">
    {% for r in resources %}
    <div class="card">
        <h3>{{ r.title }}</h3>
        <p class="category">{{ r.get_category_display }}</p>
        <p>{{ r.description }}</p>

        {% if r.file %}
            <a href="{{ r.file.url }}" target="_blank">Download PDF</a>
        {% endif %}

        {% if r.link %}
            <a href="{{ r.link }}" target="_blank">Open Link</a>
        {% endif %}
    </div>
    {% endfor %}
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            overflow: hidden;
        }

        /* Floating background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 10s infinite ease-in-out;
        }

        .circle.one {
            width: 200px;
            height: 200px;
            background: white;
            top: 10%;
            left: 15%;
        }

        .circle.two {
            width: 300px;
            height: 300px;
            background: white;
            bottom: 10%;
            right: 15%;
            animation-delay: 3s;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }

        /* Login card */
        .container {
            background: white;
            width: 360px;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: slideFade 0.8s ease forwards;
            z-index: 2;
        }

        @keyframes slideFade {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: 0.3s;
            font-size: 14px;
        }

        /* Input focus animation */
        input:focus {
            border-color: #43e97b;
            box-shadow: 0 0 8px rgba(67,233,123,0.6);
            outline: none;
            transform: scale(1.02);
        }

        /* Button animation */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #43e97b, #2ecc71);
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.96);
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 10px;
            animation: shake 0.4s;
        }

        /* Error shake animation */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .footer {
            text-align: center;
            margin-top: 15px;
        }

        .footer a {
            text-decoration: none;
            color: #43e97b;
            font-weight: 500;
        }
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid white;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
}
        .dark {
            background: #121212 !important;
        }

        .dark .container {
            background: #1e1e1e;
            color: white;
        }

        .dark input {
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        .dark button {
            background: #444;
        }
        .dark-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 14px;
            font-size: 18px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
            z-index: 1000;
        }

        .dark-toggle:hover {
            transform: scale(1.1);
        }


    </style>
</head>
<script>
function toggleDarkMode() {
    document.body.classList.toggle("dark");
    localStorage.setItem("darkMode", document.body.classList.contains("dark"));
}

if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}
</script>

<script>
document.querySelector("form").addEventListener("submit", function() {
    document.getElementById("btnText").style.display = "none";
    document.getElementById("loader").style.display = "inline-block";
});
</script>
<script>
function togglePassword() {
    const pwd = document.getElementById("password");
    pwd.type = pwd.type === "password" ? "text" : "password";
}
</script>


<body>
<button onclick="toggleDarkMode()" class="dark-toggle">🌙</button>

    
</button>

<!-- Animated background -->
<div class="circle one"></div>
<div class="circle two"></div>

<!-- Login Card -->
<div class="container">
    <h2>Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required>
        <div style="position: relative;">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span onclick="togglePassword()" 
                        style="position:absolute; right:12px; top:12px; cursor:pointer;">
                    👁️
            </span>
        </div>

        <button type="submit" id="loginBtn">
                <span id="btnText">Login</span>
                <span class="loader" id="loader"></span>
        </button>

    </form>

    <div class="footer">
        New user? <a href="/register/">Create account</a>
    </div>
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Placement Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f9ff;
            overflow-x: hidden;
            position: relative;
        }

        /* Living Mesh Gradient Background */
        .background-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: #ffffff;
        }

        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.6;
            animation: moveBlob 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #c084fc;
            /* Purple */
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 50vw;
            height: 50vw;
            background: #60a5fa;
            /* Blue */
            animation-delay: -5s;
        }

        .blob-3 {
            bottom: 20%;
            left: 20%;
            width: 30vw;
            height: 30vw;
            background: #f472b6;
            /* Pink */
            animation-delay: -10s;
        }

        @keyframes moveBlob {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 50px) scale(1.1);
            }
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            position: relative;
            z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card-header {
            padding: 40px 40px 20px 40px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card-body {
            padding: 20px 40px 40px 40px;
        }

        .form-grid {
            display: grid;
            gap: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-group input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.15);
            transform: scale(1.02);
        }

        .form-group:focus-within label {
            color: var(--primary-color);
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .btn-register:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .card-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            position: relative;
        }

        .card-footer a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 0;
            background-color: var(--primary-color);
            transition: width 0.3s;
        }

        .card-footer a:hover::after {
            width: 100%;
        }

        .error-msg {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* Floating elements for "Human" touch */
        .decoration {
            position: absolute;
            font-size: 2rem;
            animation: float 6s infinite ease-in-out;
            z-index: 20;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }
    </style>
</head>

<body>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Decorative Emojis -->
    <div class="decoration" style="top: 15%; left: 15%; animation-delay: 0s;">✨</div>
    <div class="decoration" style="bottom: 15%; right: 15%; animation-delay: 1s;">🌿</div>
    <div class="decoration" style="top: 20%; right: 20%; font-size: 1.5rem; animation-delay: 2s;">👋</div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Join the Community</h2>
                <p>Create your account to get started</p>
            </div>

            <div class="card-body">
                {% if form.errors %}
                <div class="error-msg">
                    <strong>Oops!</strong> Please check the details below.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="username">Username</label>
                            <input type="text" name="username" placeholder="Choose a username" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="email">Email Address</label>
                            <input type="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="password">Password</label>
                            <input type="password" name="password1" placeholder="Create a password" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="confirm_password">Confirm Password</label>
                            <input type="password" name="password2" placeholder="Confirm your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-register">Start Journey</button>
                </form>

                <div class="card-footer">
                    Already part of the team? <a href="{% url 'login' %}">Log in here</a>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
